<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja prvá webstránka</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #1769aa;
        }

        p {
            font-size: 18px;
            color: #333333;
        }

        button {
            background-color: #1769aa;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d4777;
        }
    </style>
</head>

<body>

    <h1>Ahoj, svet!</h1>

    <p>Toto je moja úplne prvá webstránka.</p>

    <p>Vytvoril som ju pomocou GitHub Pages!</p>

    <button onclick="alert('Gratulujem! Tvoje tlačidlo funguje!')">
        Klikni na mňa
    </button>

</body>
</html>
